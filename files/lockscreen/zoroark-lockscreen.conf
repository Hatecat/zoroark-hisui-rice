# Pantalla de bloqueo Zoroark de Hisui: kscreenlocker_greet hereda el entorno de KWin
# y usa PLASMA_DEFAULT_SHELL para elegir el paquete de la pantalla de bloqueo.
# Solo se aplica a KWin; plasmashell sigue usando org.kde.plasma.desktop.
[Service]
Environment=PLASMA_DEFAULT_SHELL=org.zoroark.hisui.lockscreen
