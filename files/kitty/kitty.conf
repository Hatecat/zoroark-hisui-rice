# Lainux Cyber Kitty Theme
# Matching conky cyan/magenta/yellow palette

# Font
font_family      Cascadia Code NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor
cursor                  #F3C94E
cursor_text_color       #29262D
cursor_shape            beam
cursor_blink_interval   0.5

# Scrollback
scrollback_lines        10000

# Mouse
mouse_hide_wait         3.0
url_color               #EA00D9
url_style               curly

# Terminal bell
enable_audio_bell       no
visual_bell_duration    0.0

# Window
remember_window_size    no
initial_window_width    90c
initial_window_height   30c
window_padding_width    12
background_opacity      0.8
dynamic_background_opacity yes

# Tab bar
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #050505
active_tab_background   #0ABDC6
inactive_tab_foreground #8A9BAD
inactive_tab_background #1a1a1a
tab_bar_background      #050505

# Colour scheme - Lainux Cyber
foreground              #29262D
background              #F2F0F0
selection_foreground    #D82F45
selection_background    #29262D

# Black
color0                  #050505
color8                  #1a1a1a

# Red
color1                  #FF4A57
color9                  #FF6B74

# Green (distinct from cyan)
color2                  #2ED88C
color10                 #50F0AA

# Yellow
color3                  #F3E600
color11                 #FFFF5C

# Blue (using cyan)
color4                  #0ABDC6
color12                 #5CE5ED

# Magenta
color5                  #EA00D9
color13                 #FF5CE5

# Cyan
color6                  #0ABDC6
color14                 #5CE5ED

# White
color7                  #8A9BAD
color15                 #E0E8F0

# Keyboard shortcuts
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+t        new_tab
map ctrl+shift+q        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+plus     change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0



# Zoroark de Hisui — Kitty Theme

# Fondo y texto
background              #29262D
foreground              #F2F0F0
selection_background    #D82F45
selection_foreground    #F2F0F0
cursor                  #F3C94E
cursor_text_color       #29262D

# Opacidad (1.0 = opaco)
background_opacity      0.8

# Colores de la terminal
color0  #29262D
color8  #777782

color1  #D82F45
color9  #E84B60

color2  #8E1E32
color10 #B52A42

color3  #F3C94E
color11 #F8DB7A

color4  #777782
color12 #B7B7C0

color5  #E6A1AB
color13 #F0BBC4

color6  #B7B7C0
color14 #D8D6DF

color7  #F2F0F0
color15 #FFFFFF

# Bordes y pestañas
active_border_color     #D82F45
inactive_border_color   #777782
bell_border_color       #F3C94E
tab_bar_style           powerline
active_tab_foreground   #F2F0F0
active_tab_background   #8E1E32
inactive_tab_foreground #B7B7C0
inactive_tab_background #29262D

# Zoroark de Hisui: sesion personalizada
startup_session @HOME@/.config/kitty/zoroark-session.conf

# Seleccionar una ruta visible y abrirla con Dolphin
map ctrl+shift+o kitten hints --type=path --program dolphin

# Nueva terminal a lo ancho, debajo de todas las demás (layout splits)
map ctrl+shift+enter combine : launch --cwd=current --location=hsplit --env NO_FASTFETCH=1 : layout_action move_to_screen_edge bottom
