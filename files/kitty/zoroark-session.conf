layout splits

# Zoroark (fastfetch) a la izquierda; abajo, a lo ancho, cava + reloj
launch --title="Zoroark de Hisui" --var panel=zoroark @HOME@/.config/kitty/zoroark-start.sh
launch --location=hsplit --bias=25 --title="Cava" --var panel=cava cava
# tty-clock necesita >= 35 columnas; espera a que kitty termine de repartir los
# paneles o se queda sin dibujar los dígitos
launch --location=vsplit --bias=20 --title="Reloj" sh -c 'sleep 0.5; exec @HOME@/.local/bin/tty-clock -c -C 1 -f %d/%m/%Y'

# Columna derecha: btop (necesita >= 24 filas) y Terminal 3
focus_matching_window var:panel=zoroark
launch --location=vsplit --title="Monitor del sistema" --var panel=btop btop
launch --location=hsplit --bias=35 --title="Terminal 3" --env NO_FASTFETCH=1
